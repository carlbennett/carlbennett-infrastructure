---
- name: 'Ensure Plex package is installed'
  ansible.builtin.package:
    name: "{{ plex_package_name }}"
    state: 'present'

- name: 'Copy Plex firewalld service definition'
  ansible.builtin.template:
    src: 'templates/firewalld/plexmediaserver_service.xml.j2'
    dest: "/etc/firewalld/services/{{ plex_service_firewalld }}.xml"
    owner: 'root'
    group: 'root'
    mode: '444'
  register: plex_service_firewalld_state

- name: 'Reload firewalld'
  ansible.builtin.service:
    name: 'firewalld'
    state: 'reloaded'
  when: plex_service_firewalld_state is changed

- name: 'Permit traffic in default firewalld zone for Plex service'
  ansible.posix.firewalld:
    service: "{{ plex_service_firewalld }}"
    permanent: true
    state: 'enabled'

- name: 'Enable and start Plex service'
  ansible.builtin.service:
    name: "{{ plex_service_systemd }}"
    enabled: true
    state: 'started'
