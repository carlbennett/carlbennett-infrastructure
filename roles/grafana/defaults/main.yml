---
# The system package name for Grafana.
grafana_package_name: 'grafana'

# The service unit name for Grafana.
grafana_service_name: 'grafana-server'

# The TCP port that Grafana will listen on.
grafana_port: 3000

# The url to the Grafana instance.
grafana_url: 'http://localhost:3000/'

# Grafana datasources to setup.
grafana_datasources: []

# Grafana plugins to install and keep updated.
grafana_plugins:
- 'cloudflare-app'
- 'grafana-clock-panel'
- 'grafana-github-datasource'
#- 'grafana-gitlab-datasource'
- 'grafana-image-renderer'
- 'grafana-simple-json-datasource'
- 'grafana-worldmap-panel'

# Legacy Grafana API key.
grafana_api_key: null

# The service account user to use with Grafana API.
grafana_sa_user: 'ansible'

# The service account API token that acts as the password.
grafana_sa_password: ''

# Have Grafana check for updates against GitHub remote user content?
grafana_check_for_updates: true
grafana_check_for_plugin_updates: true

grafana_users_allow_sign_up: false
grafana_users_allow_org_create: false
grafana_users_auto_assign_org: false
grafana_users_auto_assign_org_id: 1

grafana_auth_github_enabled: false
grafana_auth_github_allow_sign_up: true
grafana_auth_github_client_id: 'some_id'
grafana_auth_github_client_secret: 'some_secret'
grafana_auth_github_scopes: 'user:email,read:org'
grafana_auth_github_auth_url: 'https://github.com/login/oauth/authorize'
grafana_auth_github_token_url: 'https://github.com/login/oauth/access_token'
grafana_auth_github_api_url: 'https://api.github.com/user'
grafana_auth_github_allowed_domains: ''
grafana_auth_github_team_ids: ''
grafana_auth_github_allowed_organizations: ''

grafana_smtp_enabled: true
grafana_smtp_host: 'localhost:25'
grafana_smtp_user: ''
grafana_smtp_password: ''
grafana_smtp_from_address: "grafana@{{ ansible_facts['fqdn'] }}"

grafana_emails_welcome_email_on_sign_up: true
