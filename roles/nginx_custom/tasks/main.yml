---
- name: Install or update '{{ nginx_package_name }}' package
  package:
    name: '{{ nginx_package_name }}'
    state: latest
  register: nginx_package_state

- name: Create nginx configuration directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: 0755
  with_items:
  - '/etc/nginx'
  - '/etc/nginx/conf.d'
  - '/etc/nginx/default.d'
  - '/etc/nginx/vhost.d'
  register: nginx_config_dir_state

- name: Update optional includable nginx configuration files
  template:
    src: 'conf.d/{{ item }}.conf.j2'
    dest: '/etc/nginx/conf.d/{{ item }}.conf'
    owner: root
    group: root
    mode: 0444
  with_items:
  - 'autoindex'
  - 'expires'
  - 'gzip'
  - 'url-filter-blackhat'
  - 'url-filter-cgi'
  - 'url-filter-git'
  - 'url-filter-phpmyadmin'
  - 'url-filter-wordpress'
  register: nginx_optional_config_state

#- name: Update nginx vhost configuration files
#  template:
#    src: 'vhost.conf.j2'
#    dest: '/etc/nginx/vhost.d/{{ item.name }}.conf'
#    owner: root
#    group: root
#    mode: 0444
#  loop: '{{ nginx_vhosts }}'
#  register: nginx_vhost_config_state

- name: Test nginx configuration
  shell: 'nginx -t'
  when:
  - nginx_package_state is changed
  - nginx_config_dir_state is changed
  - nginx_optional_config_state is changed
#  - nginx_vhost_config_state is changed

- name: Restart nginx
  service:
    name: '{{ nginx_service_name }}'
    state: restarted
  when:
  - nginx_package_state is changed
  - nginx_config_dir_state is changed
  - nginx_optional_config_state is changed
  #- nginx_vhost_config_state is changed

- name: Enable and start '{{ nginx_service_name }}'
  service:
    name: '{{ nginx_service_name }}'
    enabled: yes
    state: started

- name: Permit traffic in default zone for 'http' service
  ansible.posix.firewalld:
    service: http
    permanent: yes
    state: enabled
  register: firewalld_permit_http_state

- name: Permit traffic in default zone for 'https' service
  ansible.posix.firewalld:
    service: https
    permanent: yes
    state: enabled
  register: firewalld_permit_https_state

- name: Reload firewalld
  shell: 'firewall-cmd --reload'
  when:
  - firewalld_permit_http_state is changed
  - firewalld_permit_https_state is changed
