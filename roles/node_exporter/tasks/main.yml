---
- name: 'Ensure {{ prometheus_node_exporter_package_name }} package is installed'
  package:
    name: '{{ prometheus_node_exporter_package_name }}'
    state: present

- name: 'Copy {{ prometheus_node_exporter_environment_file }} service environment configuration'
  template:
    src: prometheus/node_exporter.env.j2
    dest: '/etc/sysconfig/{{ prometheus_node_exporter_environment_file }}'
    owner: root
    group: root
    mode: 0444
  register: prometheus_node_exporter_environment_config_state

- name: 'Create {{ prometheus_node_exporter_service_name }} service local configuration directory'
  file:
    path: '/etc/systemd/system/{{ prometheus_node_exporter_service_name }}.service.d'
    state: directory
    owner: root
    group: root
    mode: 0755
  register: prometheus_node_exporter_service_config_dir_state

- name: 'Copy {{ prometheus_node_exporter_service_name }} service local configuration'
  template:
    src: prometheus/node_exporter.service.j2
    dest: '/etc/systemd/system/{{ prometheus_node_exporter_service_name }}.service.d/ansible.conf'
    owner: root
    group: root
    mode: 0444
  register: prometheus_node_exporter_service_config_state

- name: 'Remove pre-existing local installation'
  file:
    path: '{{ item }}'
    state: absent
  with_items:
  - '/etc/systemd/system/node_exporter.service'
  - '/usr/local/bin/node_exporter'
  register: prometheus_node_exporter_local_install_removal_state

- name: 'Reload SystemD Daemon'
  shell: 'systemctl daemon-reload'
  when:
  - prometheus_node_exporter_service_config_dir_state is changed
  - prometheus_node_exporter_service_config_state is changed
  - prometheus_node_exporter_local_install_removal_state is changed

- name: 'Restart {{ prometheus_node_exporter_service_name }} service'
  service:
    name: '{{ prometheus_node_exporter_service_name }}'
    state: restarted
  when:
  - prometheus_node_exporter_environment_config_state is changed
  - prometheus_node_exporter_service_config_dir_state is changed
  - prometheus_node_exporter_service_config_state is changed
  - prometheus_node_exporter_local_install_removal_state is changed

- name: 'Ensure {{ prometheus_node_exporter_service_name }} service is enabled and started'
  service:
    name: '{{ prometheus_node_exporter_service_name }}'
    enabled: yes
    state: started
