---
- name: Converge all hosts
  hosts: all
  gather_facts: true
  become: true
  become_user: root
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Include base role
      ansible.builtin.include_role:
        name: base

    - name: Include Grafana role
      ansible.builtin.include_role:
        name: grafana
      when: "'grafana_servers' in group_names"

    - name: Include Infping role
      ansible.builtin.include_role:
        name: infping
      when: "'infping_servers' in group_names"

    - name: Include Jenkins role
      ansible.builtin.include_role:
        name: jenkins
      when: "'jenkins_servers' in group_names"

    - name: Include Nginx Custom role
      ansible.builtin.include_role:
        name: nginx_custom
      when: "'nginx_servers' in group_names"

    - name: Include Nginxinc Nginx role
      ansible.builtin.include_role:
        name: nginxinc_nginx
      when: "'nginxinc_nginx_servers' in group_names"

    - name: Include Nginxinc Nginx Config role
      ansible.builtin.include_role:
        name: nginxinc_nginx_config
      when: "'nginxinc_nginx_servers' in group_names"

    - name: Include Node Exporter for Prometheus role
      ansible.builtin.include_role:
        name: node_exporter
      when: "'node_exporter_servers' in group_names"

    - name: Include Plex role
      ansible.builtin.include_role:
        name: plex
      when: "'plex_servers' in group_names or ansible_facts.packages['plexmediaserver'] is defined"

    - name: Include Prometheus role
      ansible.builtin.include_role:
        name: prometheus
      when: "'prometheus_servers' in group_names"
